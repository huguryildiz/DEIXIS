# Runs the full test suite (slow tests included), split over four machines, and the web build on every push to main, so
# the developer's Mac only runs `pytest --testmon tests`. Informational only: no branch rule requires it, so a red run
# never blocks a push. macOS arm64, the only platform the app supports.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.shard }}/4)
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web  # some backend tests run the web TypeScript through node and need its typescript
      - run: uv sync --frozen
      - run: uv run --no-sync pytest -n 3 -m "slow or not slow"
        env:
          DEIXIS_TEST_SHARD: ${{ matrix.shard }}/4  # tests/conftest.py keeps this machine's part

  web:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
