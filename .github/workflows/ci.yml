# Runs the whole test suite, the web build and the five Playwright specs on every push to main, so the developer's Mac only runs
# `pytest --testmon tests`. Informational only: no branch rule requires it, so a red run never blocks a push.
# macOS arm64, the only platform the app supports.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web  # some backend tests run the web TypeScript through node and need its typescript
      - run: uv sync --frozen
      - run: uv run --no-sync pytest -n 3

  web:  # lint, a fresh build, then the five Playwright specs against that build (tests/acceptance/fixture_server.py)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: uv sync --frozen  # the specs start the fixture server with the repo's .venv python
        working-directory: .
      - run: test -d "/Applications/Google Chrome.app" || npx playwright install chrome  # playwright.config.ts uses channel chrome
      - run: npm run test:acceptance
        env:
          DEIXIS_ACCEPTANCE_DIR: ${{ runner.temp }}/deixis-acceptance  # outside the checkout, a fresh folder per run
