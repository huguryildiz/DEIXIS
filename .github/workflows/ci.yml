# Runs the whole test suite and the web build on every push to main, so the developer's Mac only runs
# `pytest --testmon tests`. Informational only: no branch rule requires it, so a red run never blocks a push.
# macOS arm64, the only platform the app supports.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web  # some backend tests run the web TypeScript through node and need its typescript
      - run: uv sync --frozen
      - run: uv run --no-sync pytest -n 3

  web:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
