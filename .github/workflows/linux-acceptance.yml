# P10 Linux (L5): acceptance of the INSTALLED app on Linux x64 runners. Started by hand only
# (`gh workflow run linux-acceptance.yml -f run_id=<linux-desktop run>`). Downloads the .deb and the AppImage that
# linux-desktop.yml built in that run (the files under test are those exact files; their SHA-256 is in the result) and
# runs scripts/p10/linux_acceptance.py on Ubuntu 22.04 and 24.04 inside Xvfb with Openbox and a D-Bus session: the .deb
# installed with apt (dependencies resolved), the AppImage run as a file; in-window rows through tauri-driver and
# WebKitWebDriver; close, killed shell and killed backend under a hanging fake codex and a PDF child; downloads; removal.
# The fake codex needs the repo's Python packages (uv sync). Evidence (results.json, screenshots, logs, downloaded files)
# is kept as an artifact per runner image.
name: linux-acceptance

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "linux-desktop.yml run whose deixis-linux-packages artifact is tested"
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: linux-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Desktop session tools
        run: |
          fuse=libfuse2; dpkg --compare-versions "$(lsb_release -rs)" ge 24.04 && fuse=libfuse2t64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox wmctrl imagemagick dbus-x11 webkit2gtk-driver \
            "$fuse"
          cargo install tauri-driver --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Packages from the linux-desktop run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" -n deixis-linux-packages -D packages --repo "${{ github.repository }}"
          find packages -type f -exec ls -la {} +
      - name: Acceptance
        run: |
          deb=$(find packages -name '*.deb' | head -1); app=$(find packages -name '*.AppImage' | head -1)
          xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- bash -c "openbox & sleep 2; \
            uv run --no-sync python scripts/p10/linux_acceptance.py --deb '$deb' --appimage '$app' --evidence evidence" \
            2>&1 | tee acceptance.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deixis-linux-acceptance-${{ matrix.os }}
          path: |
            acceptance.txt
            evidence/
