# The full pytest run (slow tests included) on GitHub's machines, so a push does not cost the developer's Mac 15 minutes.
# Locally, `uv run pytest --testmon tests` runs only the tests that touch changed code.
name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      # Some tests run the web app's TypeScript helpers with node, which need its packages.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: uv run pytest -m "slow or not slow" -n auto
