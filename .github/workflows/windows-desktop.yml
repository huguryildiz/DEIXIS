# P10 Windows (W4, W3): the Tauri shell and the real backend sidecar on a Windows x64 runner. Started by hand only
# (`gh workflow run windows-desktop.yml`). Builds the sidecar (PyInstaller onedir: deixis-backend.exe + _internal\),
# runs the sidecar smoke against it (scripts/desktop/sidecar_smoke.py, OCR with the package's own language data and no
# Tesseract installed, and the DLL probe built with rustc), lints and tests the shell, then builds the NSIS installer around that sidecar
# (packaging/build_windows.py: the sidecar inside equals the build, SHA-256 printed) and keeps it as an artifact.
name: windows-desktop

on:
  workflow_dispatch:

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: uv sync --frozen --group packaging
      - name: Sidecar
        run: uv run --no-sync python packaging/sidecar/build.py
      - name: Sidecar smoke
        id: smoke
        continue-on-error: true
        run: uv run --no-sync python scripts/desktop/sidecar_smoke.py 2>&1 | tee sidecar-smoke.txt; exit ${PIPESTATUS[0]}
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: desktop/src-tauri
      - run: cargo test --locked
        working-directory: desktop/src-tauri
      - name: Installer
        run: uv run --no-sync python packaging/build_windows.py --skip-sidecar 2>&1 | tee installer.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deixis-windows-logs
          path: |
            sidecar-smoke.txt
            installer.txt
      - uses: actions/upload-artifact@v4
        with:
          name: deixis-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: The smoke must pass
        if: steps.smoke.outcome != 'success'
        run: exit 1
