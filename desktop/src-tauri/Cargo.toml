[package]
name = "deixis-desktop"
version = "0.1.0"
description = "The DEIXIS desktop shell: window, tray item and the backend's lifetime (P10 M2 macOS, W4 Windows)"
edition = "2021"
publish = false

[[bin]]
name = "deixis-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
dirs = "7"
dunce = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
