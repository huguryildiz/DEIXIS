[package]
name = "deixis-desktop"
version = "0.1.0"
description = "The DEIXIS macOS shell: window, menu-bar item and the backend's lifetime (P10 M2)"
edition = "2021"
publish = false

[[bin]]
name = "deixis-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
