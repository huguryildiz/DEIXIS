<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEIXIS</title>
  <style>
    :root {
      --bg: #f7f8fb; --surface: #ffffff; --text: #1d2433; --muted: #566074; --line: #dfe3ea;
      --accent: #3b5b9a; --accent-ink: #ffffff; --exclude-ink: #9b2c2c; --exclude-bg: #fbecec;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171d; --surface: #1b1f27; --text: #e6e9ef; --muted: #a3abba; --line: #2c323d;
        --accent: #8aa6e0; --accent-ink: #10141b; --exclude-ink: #f3b4b4; --exclude-bg: #3a2023;
      }
    }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font: 14px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      display: grid; place-items: center;
    }
    main { width: min(440px, calc(100% - 32px)); }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
    p { margin: 0 0 12px; color: var(--muted); }
    code { font: 12px/1.4 ui-monospace, Menlo, monospace; word-break: break-all; color: var(--text); }
    .notice { background: var(--exclude-bg); color: var(--exclude-ink); border-radius: 7px; padding: 10px 12px; margin-bottom: 16px; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    a.button {
      display: inline-block; text-decoration: none; border-radius: 6px; padding: 7px 14px; font-weight: 550;
      border: 1px solid var(--line); color: var(--text);
    }
    a.button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    a.button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 999px; background: var(--accent); margin-right: 8px;
      animation: pulse 1.2s ease-in-out infinite; vertical-align: middle; }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <section id="starting" class="panel">
      <h1>DEIXIS</h1>
      <p role="status"><span class="pulse" aria-hidden="true"></span><span data-t="starting">Starting the research workspace…</span></p>
    </section>
    <section id="stopped" class="panel" hidden>
      <h1 data-t="stoppedTitle">The backend stopped</h1>
      <div class="notice" role="alert" data-t="stoppedText">DEIXIS's backend ended unexpectedly. Work that was running is paused and can be resumed after a restart.</div>
      <p><span data-t="log">Log file:</span> <code id="log"></code></p>
      <div class="actions">
        <a class="button primary" href="/action/restart" data-t="restart">Restart</a>
        <a class="button" href="/action/quit" data-t="quit">Quit</a>
      </div>
    </section>
  </main>
  <script>
    const tr = {
      starting: "Araştırma çalışma alanı başlatılıyor…",
      stoppedTitle: "Arka uç durdu",
      stoppedText: "DEIXIS'in arka ucu beklenmedik biçimde kapandı. Çalışan işler duraklatıldı; yeniden başlattıktan sonra sürdürülebilir.",
      log: "Kayıt dosyası:",
      restart: "Yeniden başlat",
      quit: "Çık",
    };
    if ((navigator.language || "").toLowerCase().startsWith("tr")) {
      document.documentElement.lang = "tr";
      for (const el of document.querySelectorAll("[data-t]")) el.textContent = tr[el.dataset.t] || el.textContent;
    }
    const params = new URLSearchParams(location.search);
    const state = params.get("state") === "stopped" ? "stopped" : "starting";
    document.getElementById("starting").hidden = state !== "starting";
    document.getElementById("stopped").hidden = state !== "stopped";
    document.getElementById("log").textContent = params.get("log") || "";
  </script>
</body>
</html>
