[project]
name = "deixis"
version = "0.1.0"
description = "DEIXIS local research workspace backend"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "claude-agent-sdk>=0.2.152",
  "fastapi>=0.115",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "keyring>=25",
  "latex2mathml>=3.81",
  "pymupdf>=1.26",
  "python-multipart>=0.0.20",
  "referencing>=0.35",
  "truststore>=0.10",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-testmon>=2.2.0",
    "pytest-xdist>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deixis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Four workers (pytest-xdist): every test builds its own library under tmp_path, so the suite parallelises cleanly.
# Four keeps the whole suite (about 1,500 cases, the real-process tests included) within about two minutes while
# leaving most cores and memory to other work.
addopts = "-n 4"
# Each run writes several GB under tmp_path; keep only the directories of failed tests.
tmp_path_retention_policy = "failed"
# Explicit path: in synced Documents folders the venv's .pth files can receive the
# macOS hidden flag, which Python's site module skips.
# Test folders follow the steps and areas; modules import each other by basename, so basenames stay unique.
pythonpath = [".", "tests", "tests/support", "tests/search", "tests/screen", "tests/read", "tests/answer", "tests/features", "tests/api", "tests/models", "tests/storage", "tests/contracts", "tests/rules"]
