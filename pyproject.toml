[project]
name = "deixis"
version = "0.1.0"
description = "DEIXIS local research workspace backend"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "claude-agent-sdk>=0.2.152",
  "fastapi>=0.115",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "keyring>=25",
  "pymupdf>=1.26",
  "python-multipart>=0.0.20",
  "referencing>=0.35",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/deixis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Six workers (pytest-xdist): every test builds its own library under tmp_path, so the suite parallelises cleanly.
# Measured 2026-10-05 on a 10-core Apple Silicon machine under load from other work: the default run (slow tests left
# out, see tests/conftest.py) took 81 s with 6 workers and with 10; 6 used 15% less CPU and 20% less memory.
addopts = "-n 6"
# Explicit path: in synced Documents folders the venv's .pth files can receive the
# macOS hidden flag, which Python's site module skips.
pythonpath = ["backend", ".", "tests", "tests/app", "tests/candidates", "tests/contracts", "tests/discovery", "tests/documents", "tests/hardening", "tests/lineage", "tests/measurement", "tests/models", "tests/providers", "tests/reextract", "tests/report", "tests/review", "tests/storage", "tests/watch"]
